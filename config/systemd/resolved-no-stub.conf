# /etc/systemd/resolved.conf.d/homerouter.conf
# Managed by https://github.com/mklarsen/homerouter
# dnsmasq owns port 53 on br0; disable the systemd-resolved stub listener so the
# two do not fight over 127.0.0.53:53 / 0.0.0.0:53.
[Resolve]
DNSStubListener=no
DNS=1.1.1.1 8.8.8.8 2606:4700:4700::1111
FallbackDNS=
