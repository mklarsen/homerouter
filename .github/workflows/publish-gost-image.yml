name: Publish Homerouter GOST image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-gost-image.yml
      - addons/proxy-router/docker-compose.ghcr.yml
      - addons/proxy-router/README.md
      - addons/proxy-router/LICENSE.GOST

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out Homerouter metadata
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/homerouter-gost
          tags: |
            type=raw,value=3.3.0
            type=raw,value=3.3.0-cb76f63
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Homerouter GOST
            org.opencontainers.image.description=Homerouter-published GOST proxy image built from the pinned upstream GOST source.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/tree/main/addons/proxy-router
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=Martin Kraus Larsen

      - name: Build and publish upstream GOST source
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/go-gost/gost.git#cb76f63754768c7b5d68895a0d51635b0141b80f
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true