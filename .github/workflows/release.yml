name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck nftables dnsmasq-base gettext-base python3-yaml

      - name: ShellCheck
        run: shellcheck -x setup.sh install.sh scripts/*.sh

      - name: Render and validate configuration
        run: sudo -E ./scripts/selftest.sh

      - name: Determine version
        id: version
        run: echo "version=v0.1.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' "$VERSION" > VERSION
          git archive --format=tar.gz \
            --prefix="homerouter-${VERSION}/" \
            --add-file=VERSION \
            -o "dist/homerouter-${VERSION}.tar.gz" \
            HEAD
          cd dist
          sha256sum "homerouter-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists"
            exit 0
          fi
          gh release create "$VERSION" \
            "dist/homerouter-${VERSION}.tar.gz" dist/SHA256SUMS \
            --target "${{ github.sha }}" \
            --title "homerouter $VERSION" \
            --generate-notes
