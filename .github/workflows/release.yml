name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build & publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck nftables dnsmasq-base gettext-base python3-yaml

      - name: ShellCheck
        run: shellcheck -x setup.sh install.sh scripts/*.sh

      - name: Render and validate configuration
        run: sudo -E ./scripts/selftest.sh

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh check
          version="v$(./scripts/changelog.sh version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "release=0" >> "$GITHUB_OUTPUT"
            echo "::notice::$version is already released -- add a new version heading to CHANGELOG.md to publish one"
          else
            echo "release=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build tarball
        if: steps.version.outputs.release == '1'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '%s\n' "$VERSION" > VERSION
          git archive --format=tar.gz \
            --prefix="homerouter-${VERSION}/" \
            --add-file=VERSION \
            -o "dist/homerouter-${VERSION}.tar.gz" \
            HEAD
          cd dist
          sha256sum "homerouter-${VERSION}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        if: steps.version.outputs.release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/changelog.sh notes > release-notes.md
          cat release-notes.md
          gh release create "$VERSION" \
            "dist/homerouter-${VERSION}.tar.gz" dist/SHA256SUMS \
            --target "$(git rev-parse HEAD)" \
            --title "homerouter $VERSION" \
            --notes-file release-notes.md
