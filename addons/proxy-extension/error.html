<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <title>homerouter.io | Forbindelsesfejl</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0c1411;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #13221b;
      border: 1px solid #1c352a;
      border-top: 4px solid #ef4444;
      border-radius: 8px;
      padding: 32px;
      max-width: 440px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      background: #201315;
      border: 1px solid #3f1d24;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      color: #f87171;
      margin-bottom: 20px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.8);
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 22px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .details {
      background: #090e0c;
      border: 1px solid #1c352a;
      border-radius: 6px;
      padding: 10px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #38bdf8;
      word-break: break-all;
      margin-bottom: 24px;
      text-align: left;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .btn-primary {
      background: #1e3a5f;
      color: #ffffff;
    }
    .btn-primary:hover { background: #24426d; }
    .btn-secondary {
      background: #1c352a;
      color: #cbd5e1;
    }
    .btn-secondary:hover { background: #264739; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span class="dot"></span>
      <span>TUNNEL AFBRUDT</span>
    </div>

    <h1>Forbindelse mistet</h1>
    <p>Kunne ikke oprette forbindelse gennem din Homerouter VPN. Serveren kan være offline, eller tunnelen er midlertidigt nede.</p>

    <div class="details" id="errorTarget">Indlæser adresse...</div>

    <div class="actions">
      <button class="btn-primary" id="retryBtn">Prøv igen</button>
      <button class="btn-secondary" id="disableBtn">Slå VPN fra</button>
    </div>
  </div>

  <script src="error.js"></script>
</body>
</html>
