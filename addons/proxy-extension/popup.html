<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg-main: #060b09;
      --bg-panel: #0a130f;
      --bg-input: #030605;
      --border-dark: #12241b;
      --border-accent: #1e3d2f;
      --border-cyan: #0284c7;
      --accent-green: #10b981;
      --accent-cyan: #38bdf8;
      --accent-yellow: #facc15;
      --text-main: #e2e8f0;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      width: 270px;
      margin: 0;
      padding: 14px 14px 12px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.9);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-cyan), #60a5fa 48%, var(--accent-yellow));
    }

    .header-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 12px;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 12px;
      background: var(--bg-panel);
      border: 1px solid var(--border-accent);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border-radius: 999px;
      min-height: 28px;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .badge.online {
      color: #d1fae5;
      border-color: rgba(16, 185, 129, 0.28);
      background: rgba(16, 185, 129, 0.06);
    }

    .badge.offline {
      color: #94a3b8;
      border-color: rgba(100, 116, 139, 0.28);
    }

    .dot {
      width: 8px;
      height: 8px;
      flex: 0 0 8px;
      border-radius: 50%;
      background: #64748b;
    }

    .dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 9px rgba(16, 185, 129, 0.8);
    }

    .dot.inactive {
      background: #64748b;
      box-shadow: 0 0 7px rgba(100, 116, 139, 0.35);
    }

    .settings-btn {
      background: var(--bg-panel);
      border: 1px solid var(--border-dark);
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      padding: 4px 7px;
      line-height: 1;
      transition: all 0.15s ease;
      border-radius: 6px;
      position: absolute;
      right: 0;
    }

    .settings-btn:hover {
      color: var(--accent-cyan);
      border-color: var(--border-accent);
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: lowercase;
    }

    .sub {
      margin: 2px 0 14px 0;
      font-size: 9px;
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      font-weight: 600;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .btn-frame {
      padding: 1px;
      background: linear-gradient(110deg, rgba(56, 189, 248, 0.7), rgba(250, 204, 21, 0.55));
      margin-bottom: 12px;
      border-radius: 8px;
    }

    button.action-btn {
      width: 100%;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0;
      transition: all 0.15s ease;
      border-radius: 7px;
    }

    button.disconnected {
      background: #0d211b;
      color: #34d399;
      border-color: #163d30;
    }

    button.disconnected:hover {
      background: #112d25;
      border-color: #1e5241;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
    }

    button.connected {
      background: #330f12;
      color: #f87171;
      border-color: #54171c;
      border-radius: 6px;
    }

    button.connected:hover {
      background: #421418;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.25);
    }

    #settingsPanel {
      display: none;
      text-align: left;
      margin-bottom: 12px;
      padding: 8px 10px;
      background: var(--bg-panel);
      border: 1px solid var(--border-accent);
      border-left: 2px solid var(--accent-cyan);
      border-radius: 7px;
    }

    .form-group {
      margin-bottom: 6px;
    }

    label {
      display: block;
      font-size: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 2px;
      font-family: ui-monospace, monospace;
    }

    input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-dark);
      padding: 4px 6px;
      color: var(--accent-cyan);
      font-size: 11px;
      font-family: ui-monospace, monospace;
      border-radius: 5px;
    }

    input:focus {
      outline: none;
      border-color: var(--border-cyan);
    }

    .save-btn {
      width: 100%;
      padding: 6px;
      font-size: 10px;
      font-weight: 700;
      background: #0d211b;
      color: #34d399;
      border: 1px solid #163d30;
      cursor: pointer;
      margin-top: 4px;
      font-family: ui-monospace, monospace;
      border-radius: 5px;
    }

    .save-btn:hover {
      background: #112d25;
      border-color: #1e5241;
    }

    .save-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #settingsFeedback {
      margin-top: 5px;
      font-size: 9px;
      text-align: center;
      min-height: 11px;
      font-family: ui-monospace, monospace;
    }

    .feedback-error { color: #f87171; }
    .feedback-success { color: #34d399; }
    .feedback-loading { color: var(--accent-cyan); }
    .feedback-warning { color: var(--accent-yellow); }

    hr {
      border: none;
      border-top: 1px solid var(--border-dark);
      margin: 10px 0 8px 0;
    }

    .footer {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 9px;
      color: var(--text-muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.3px;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s ease;
    }

    .footer a:hover {
      color: var(--accent-cyan);
    }

    .footer .sec-line {
      color: #475569;
    }

    .footer .sec-line span {
      color: #64748b;
    }

    .footer .bmc-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      margin-top: 1px;
    }

    .footer .bmc-line a {
      color: #94a3b8;
    }

    .footer .bmc-line a:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div id="connectionBadge" class="badge offline">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">TUNNEL OFF</span>
    </div>
    <button id="toggleSettings" class="settings-btn" title="Konfiguration">⚙</button>
  </div>

  <h1>homerouter.io</h1>
  <div class="sub">SECURE TUNNEL</div>

  <div id="settingsPanel">
    <div class="form-group">
      <label>Host</label>
      <input type="text" id="cfgHost" placeholder="vpn.homerouter.io">
    </div>
    <div class="form-group">
      <label>Port</label>
      <input type="number" id="cfgPort" placeholder="443">
    </div>
    <div class="form-group">
      <label>Brugernavn</label>
      <input type="text" id="cfgUser" placeholder="Brugernavn">
    </div>
    <div class="form-group">
      <label>Adgangskode</label>
      <input type="password" id="cfgPass" placeholder="Adgangskode">
    </div>
    <button id="saveSettingsBtn" class="save-btn">GEM &amp; TEST</button>
    <div id="settingsFeedback"></div>
  </div>

  <div class="btn-frame">
    <button id="toggleBtn" class="action-btn disconnected">TILSLUT TUNNEL</button>
  </div>

  <hr>
  <div class="footer">
    <div class="sec-line">
      SECURED BY <a href="https://github.com/mklarsen/homerouter" target="_blank" rel="noopener noreferrer">homerouter.io</a> Development by <a href="https://github.com/mklarsen" target="_blank" rel="noopener">MKLarsen</a>
    </div>
    <div class="bmc-line">
      <span>Love the work?</span>
      <a href="https://www.buymeacoffee.com/mklarsen" target="_blank" rel="noopener" title="Buy me a coffee">👉☕ </a>
    </div>

    <div class="bmc-line">
      <span>Current Version: <span id="currentVersion"></span></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
