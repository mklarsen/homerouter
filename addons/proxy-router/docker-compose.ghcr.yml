services:
  vpn-proxy:
    image: ghcr.io/mklarsen/homerouter-proxy:1.2.0
    pull_policy: always
    command: []
    environment:
      PROXY_ADMIN_PASSWORD: ${PROXY_ADMIN_PASSWORD:?Set PROXY_ADMIN_PASSWORD in /opt/stacks/.env}
      PROXY_API_TOKEN: ${PROXY_API_TOKEN:-}
      PROXY_DATA_HOST_PATH: ${PROXY_DATA_HOST_PATH:-/opt/stacks/proxy-data/users.json}
    volumes:
      - /opt/stacks/proxy-data:/data