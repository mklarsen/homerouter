openapi: 3.0.3
info:
  title: homerouter-vpn API
  version: 0.1.0
  description: >
    Peer management for the WireGuard access service. All /api/v1/peers and
    /api/v1/server routes require the static Bearer token configured in
    VPN_API_TOKEN (at least 32 characters). When the token is unset the routes
    are not served. Self-service routes under /auth and /api/v1/me use an
    HttpOnly session cookie from Authentik (OIDC) sign-in and exist only when
    VPN_OIDC_ISSUER is set.
servers:
  - url: http://10.10.10.1:8081
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string, example: dev }
  /api/v1/brand:
    get:
      summary: Branding shown to end users
      security: []
      responses:
        "200":
          description: Brand settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Brand" }
  /api/v1/server:
    get:
      summary: Server public key and connection details
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Server" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/peers:
    get:
      summary: List peers
      responses:
        "200":
          description: All peers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a peer
      description: >
        Without publicKey the server generates a key pair and embeds the private
        key in the returned config. That key is shown once and never stored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePeerRequest" }
      responses:
        "201":
          description: Peer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePeerResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Public key already registered or address pool exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/peers/{id}:
    delete:
      summary: Delete a peer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Peer removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown peer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/login:
    get:
      summary: Start SSO sign-in
      description: Redirects to the identity provider (authorization code with PKCE). Only available when VPN_OIDC_ISSUER is set.
      security: []
      responses:
        "302": { description: Redirect to the identity provider }
  /auth/callback:
    get:
      summary: Finish SSO sign-in
      description: >
        Verifies state, ID token and group membership, sets the HttpOnly session
        cookie and redirects to /api/v1/me.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
      responses:
        "303": { description: Signed in }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: Sign-in failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Account is not in the required group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /auth/logout:
    post:
      summary: End the session
      security:
        - cookieAuth: []
      responses:
        "204": { description: Signed out }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me:
    get:
      summary: Signed-in user and their peers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject: { type: string }
                  name: { type: string }
                  maxPeers: { type: integer }
                  peers:
                    type: array
                    items: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/me/peers:
    get:
      summary: List the signed-in user's peers
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Own peers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Peer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create a peer for the signed-in user
      description: >
        Same body and response as the admin create. The peer is owned by the
        user, limited by VPN_MAX_PEERS_PER_USER and expires after VPN_PEER_TTL.
        State-changing requests must come from the configured origin.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePeerRequest" }
      responses:
        "201":
          description: Peer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreatePeerResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-origin request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Duplicate key, peer limit reached or pool exhausted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/v1/me/peers/{id}:
    delete:
      summary: Delete one of the signed-in user's peers
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Peer removed }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Cross-origin request refused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Unknown peer, or not owned by the user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: vpn_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Unauthorized:
      description: Missing or invalid token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Brand:
      type: object
      properties:
        name: { type: string, example: VPN }
        color: { type: string, example: "#2563eb" }
        logoUrl: { type: string }
    Server:
      type: object
      properties:
        publicKey: { type: string }
        endpoint: { type: string, example: "vpn.example.com:51820" }
        subnet: { type: string, example: 10.10.30.0/24 }
        allowedIps:
          type: array
          items: { type: string }
    Peer:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        publicKey: { type: string }
        address: { type: string, example: 10.10.30.2 }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        owner: { type: string, description: OIDC subject; absent for admin-created peers }
        ownerName: { type: string }
    CreatePeerRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        publicKey:
          type: string
          description: Optional 32-byte base64 WireGuard public key
    CreatePeerResponse:
      type: object
      properties:
        peer: { $ref: "#/components/schemas/Peer" }
        config:
          type: string
          description: Client configuration file
