# Add this service to /opt/stacks/docker-compose.yml.
# It needs the host network namespace and NET_ADMIN to own the wg interface,
# so it runs as root with every other capability dropped. Remove
# VPN_BACKEND (or set it to fake) to run without touching the host.

  homerouter-vpn:
    container_name: homerouter-vpn
    image: ghcr.io/mklarsen/homerouter-vpn:latest
    build:
      context: ./addons/homerouter-vpn
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    environment:
      VPN_LISTEN: "10.10.10.1:8081"
      VPN_BACKEND: wg
      VPN_IF: ${VPN_IF:-wg0}
      VPN_NET4: ${VPN_NET4:-10.10.30.0/24}
      VPN_PORT: ${VPN_PORT:-51820}
      VPN_ENDPOINT: ${VPN_ENDPOINT:?set VPN_ENDPOINT to host:port}
      VPN_DNS: ${VPN_DNS:-10.10.10.1}
      VPN_ALLOWED_IPS: ${VPN_ALLOWED_IPS:-10.10.10.0/24,10.10.30.0/24}
      VPN_API_TOKEN: ${VPN_API_TOKEN:-}
      # SSO sign-in with Authentik. Leave VPN_OIDC_ISSUER empty to disable.
      VPN_OIDC_ISSUER: ${VPN_OIDC_ISSUER:-}
      VPN_OIDC_CLIENT_ID: ${VPN_OIDC_CLIENT_ID:-}
      VPN_OIDC_CLIENT_SECRET: ${VPN_OIDC_CLIENT_SECRET:-}
      VPN_OIDC_REDIRECT_URL: ${VPN_OIDC_REDIRECT_URL:-}
      VPN_OIDC_GROUP: ${VPN_OIDC_GROUP:-vpn-users}
      VPN_MAX_PEERS_PER_USER: ${VPN_MAX_PEERS_PER_USER:-5}
      VPN_PEER_TTL: ${VPN_PEER_TTL:-0}
      VPN_BRAND_NAME: ${VPN_BRAND_NAME:-VPN}
      VPN_BRAND_COLOR: ${VPN_BRAND_COLOR:-#2563eb}
      VPN_BRAND_LOGO_URL: ${VPN_BRAND_LOGO_URL:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://10.10.10.1:8081/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./homerouter-vpn-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
